  <rect width="512" height="512" rx="256" fill="url(#bg)"/>
  <circle cx="410" cy="104" r="52" fill="#fff" opacity=".38"/>
  <circle cx="92" cy="398" r="78" fill="#abd4b7" opacity=".25"/>
