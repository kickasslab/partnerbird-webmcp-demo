<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Default PartnerBird profile avatar</title>
  <desc id="desc">An abstract person silhouette on a soft green background.</desc>
  <defs>
    <radialGradient id="bg" cx="28%" cy="18%" r="92%">
      <stop offset="0" stop-color="#f1fbf3"/>
      <stop offset=".56" stop-color="#dcefe1"/>
      <stop offset="1" stop-color="#c8e1d0"/>
    </radialGradient>
    <linearGradient id="figure" x1=".2" y1=".1" x2=".8" y2=".9">
