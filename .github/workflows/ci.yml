name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://user:password@host.example.com/database
      DATABASE_URL_UNPOOLED: postgresql://user:password@host.example.com/database
      NEON_AUTH_BASE_URL: https://auth.example.com
      NEON_AUTH_COOKIE_SECRET: ci-only-placeholder-cookie-secret
      RATE_LIMIT_HMAC_SECRET: ci-only-placeholder-rate-limit-secret
      PARTNERBIRD_AGENT_MODE: mock
      PUBLIC_BASE_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:public
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
